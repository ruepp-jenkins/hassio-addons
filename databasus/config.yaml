name: "Databasus"
description: "Self-hosted database backup manager with scheduling, restore verification, and multi-storage support for PostgreSQL, MySQL, MariaDB, and MongoDB"
version: "1.0.0"
slug: "databasus"
url: "https://github.com/ruepp-jenkins/hassio-addons"
image: "ruepp/hass-image-databasus:latest"
startup: services
boot: auto
arch:
  - amd64
  - aarch64
init: false
ports:
  4005/tcp: null
ports_description:
  4005/tcp: "Databasus web dashboard"
ingress: true
ingress_port: 4005
watchdog: "http://[HOST]:[PORT]/"
